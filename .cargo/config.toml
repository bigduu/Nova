# Needed because screencapturekit links against Swift libraries.
# Without this, `cargo test` / `cargo run` will fail with
#   dyld: Library not loaded: @rpath/libswift_Concurrency.dylib
[env]
DYLD_FALLBACK_LIBRARY_PATH = { value = "/Applications/Xcode.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/macosx:/usr/lib/swift", relative = false }
