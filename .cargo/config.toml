# The Swift-runtime load issue (screencapturekit references
# @rpath/libswift_Concurrency.dylib) is handled by baking an LC_RPATH into the
# binary from build.rs, so no DYLD_* environment shim is needed for `cargo
# test`, `cargo run`, or a standalone binary. See build.rs for details.
#
# A `[env]` entry does NOT work for this: macOS strips DYLD_* variables that
# cargo injects when spawning the test/run binary.
