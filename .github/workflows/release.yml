name: Release

# Publish a Nova release from one immutable, verified version tag. Produces the
# existing universal macOS CLI archive (the contract consumed by Homebrew, npm,
# and Bamboo) plus an explicitly DEVELOPMENT-ONLY Nova.app preview built from
# the same arm64 + x86_64 binary. In parallel, it also builds real (linked, not
# just checked) Windows exes for x86_64 + aarch64 and attaches those to the same
# Release as .zip + .sha256 — see the `build-windows`/`release-windows` jobs
# below. Windows has no Homebrew/npm equivalent here; it is release-artifact-
# only (consumed by URL+checksum, e.g. by a plugin manifest).
# Finally, `plugin-manifest` fills in the committed `packaging/plugin/plugin.json`
# template with this release's real version + archive checksums and publishes
# it (bare, and as a `nova-plugin-v<ver>.tar.gz` bundle with the `skills/`
# content) so `bamboo plugin install <url>` can pull Nova in as a plugin.
#
# Trigger:  git tag v0.1.0 && git push origin v0.1.0
# Manual:   Actions → Release → Run workflow (provide the tag)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)release, e.g. v0.1.0"
        required: true

permissions:
  contents: write # create the GitHub Release + upload assets

env:
  CARGO_TERM_COLOR: always

# Do not let two manual reruns (or a tag event and a rerun) race while updating
# the same GitHub Release. Jobs build in parallel inside one workflow run.
concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # Resolve the requested tag exactly once, prove that checkout HEAD and the
  # push event (when applicable) resolve to the same commit, and pass that
  # immutable commit to every source-building job. In particular, a manual
  # re-release can never accidentally build the moving default branch.
  release-meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      commit: ${{ steps.meta.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Verify and pin release tag
        id: meta
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          RELEASE_EVENT_OBJECT: ${{ github.event_name == 'push' && github.sha || '' }}
        run: scripts/verify-release-tag.sh "$RELEASE_TAG" "$RELEASE_EVENT_OBJECT"

  # ── Build the universal CLI, app preview, and GitHub Release ──────────
  build:
    needs: release-meta
    runs-on: macos-15 # macOS 15 SDK required (apple-metal Swift bridge); matches CI
    outputs:
      version: ${{ needs.release-meta.outputs.version }}
      tag: ${{ needs.release-meta.outputs.tag }}
      commit: ${{ needs.release-meta.outputs.commit }}
      sha256: ${{ steps.pkg.outputs.sha256 }}
      asset: ${{ steps.pkg.outputs.asset }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-meta.outputs.commit }}
          fetch-depth: 0

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install Rust toolchain (both Apple targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-release-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build arm64 + x86_64
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin

      - name: Make universal binary
        run: |
          lipo -create -output nova \
            target/aarch64-apple-darwin/release/nova \
            target/x86_64-apple-darwin/release/nova
          # lipo strips the per-slice signatures; an arm64 binary MUST be at
          # least ad-hoc signed to execute, so RE-sign the fat binary. Stable
          # identifier so the binary has a consistent designated requirement.
          codesign --force --identifier com.zenith.nova --sign - nova
          lipo -info nova
          codesign -dv nova 2>&1 | head -3

      - name: Smoke test (catches dyld / Swift-rpath regressions on a clean host)
        run: |
          chmod +x nova
          ./nova --version
          ./nova --help >/dev/null

      - name: Package tarball + checksum
        id: pkg
        run: |
          VERSION="${{ needs.release-meta.outputs.version }}"
          ASSET="nova-v${VERSION}-universal-apple-darwin.tar.gz"
          tar -czf "$ASSET" nova
          SHA="$(shasum -a 256 "$ASSET" | awk '{print $1}')"
          echo "$SHA  $ASSET" > "$ASSET.sha256"
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "Built $ASSET — sha256 $SHA"

      - name: Package Nova.app development preview
        id: app_pkg
        run: |
          VERSION="${{ needs.release-meta.outputs.version }}"
          APP_ASSET="nova-v${VERSION}-universal-apple-darwin-development-app.zip"
          packaging/macos/package-development-app.sh nova "$VERSION" app-dist
          echo "asset=app-dist/$APP_ASSET" >> "$GITHUB_OUTPUT"

      # A force-moved tag between release-meta and this fresh full checkout is
      # rejected before any public Release or package-manager update occurs.
      # Repository policy must additionally protect release tags from force
      # updates during/after this job.
      - name: Re-verify tag immediately before publishing
        env:
          RELEASE_TAG: ${{ needs.release-meta.outputs.tag }}
          RELEASE_VERIFY_REMOTE: origin
        run: scripts/verify-release-tag.sh "$RELEASE_TAG"

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release-meta.outputs.tag }}
          name: Nova ${{ needs.release-meta.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            > [!WARNING]
            > `nova-v${{ needs.release-meta.outputs.version }}-universal-apple-darwin-development-app.zip`
            > is a **DEVELOPMENT ONLY** preview. It is ad-hoc signed and is not
            > Developer ID signed, notarized, or stapled. Expect Gatekeeper/TCC
            > friction; do not treat this app archive as a production release.
          files: |
            ${{ steps.pkg.outputs.asset }}
            ${{ steps.pkg.outputs.asset }}.sha256
            ${{ steps.app_pkg.outputs.asset }}
            ${{ steps.app_pkg.outputs.asset }}.sha256

  # ── Build real Windows exes (LINKED, not the CI cross-check) ──────────
  # `ci.yml`'s `windows-cross-check` job only `cargo check`/`clippy`'s the
  # aarch64 target from an Ubuntu runner — it never links. This job builds
  # on REAL Windows runners so the release actually ships a runnable .exe.
  # Runs independently of the mac `build` job (no `needs: build`) so the two
  # builds happen in parallel; only the asset-upload job below waits on mac.
  #
  # Target matrix:
  #   x86_64-pc-windows-msvc  on windows-latest — standard hosted x64 runner.
  #   aarch64-pc-windows-msvc on windows-11-arm — hosted Windows-on-Arm
  #     runner, GA for public repos (free/unlimited, same as the x64 runner;
  #     see github.blog/changelog/2025-04-14-windows-arm64-hosted-runners-
  #     now-available-in-public-preview). This gives a NATIVE arm64 build —
  #     no brittle cross-linking of aarch64-pc-windows-msvc off an x64 host.
  #     Real-link confidence: `cargo build --release --target
  #     aarch64-pc-windows-msvc` was verified end-to-end on a real ARM64
  #     Windows 11 machine (rustc/cargo + MSVC) while landing this workflow —
  #     it linked in ~2 minutes and the resulting nova.exe ran `--version`/
  #     `--help` correctly. `fail-fast: false` so a hiccup on the newer arm64
  #     runner can't take down the x64 artifact.
  build-windows:
    needs: release-meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-meta.outputs.commit }}

      - name: Install Rust toolchain (${{ matrix.target }})
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-release-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build (release)
        shell: pwsh
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Smoke test (confirms the exe actually links + runs, not just compiles)
        shell: pwsh
        run: |
          $exe = "target/${{ matrix.target }}/release/nova.exe"
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw "nova --version exited $LASTEXITCODE" }
          & $exe --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "nova --help exited $LASTEXITCODE" }

      # No code-signing here: there is no Authenticode cert / HSM for Nova
      # yet (only the mac job's ad-hoc codesign exists, which is a different,
      # cert-free mechanism unique to macOS). An unsigned .exe means Windows
      # SmartScreen will show an "unrecognized publisher" warning ("Windows
      # protected your PC") on first run — expected until a cert is obtained;
      # tracked as a follow-up, not a defect in this job.
      - name: Package zip + sha256
        id: pkg
        shell: pwsh
        run: |
          $version = "${{ needs.release-meta.outputs.version }}"
          $target  = "${{ matrix.target }}"
          $asset   = "nova-v$version-$target.zip"
          Copy-Item "target/$target/release/nova.exe" -Destination "nova.exe"
          Compress-Archive -Path "nova.exe" -DestinationPath $asset -Force
          $hash = (Get-FileHash -Algorithm SHA256 $asset).Hash.ToLower()
          "$hash  $asset" | Set-Content -Encoding ascii "$asset.sha256"
          echo "asset=$asset" >> $env:GITHUB_OUTPUT
          echo "sha256=$hash" >> $env:GITHUB_OUTPUT
          Write-Host "Built $asset — sha256 $hash"

      - name: Upload build artifact (attached to the Release by release-windows)
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.target }}
          path: |
            ${{ steps.pkg.outputs.asset }}
            ${{ steps.pkg.outputs.asset }}.sha256
          if-no-files-found: error

  # ── Attach the Windows archives to the SAME GitHub Release the mac
  # `build` job creates ─────────────────────────────────────────────────
  # Deliberately waits on `build` (mac) even though the compiles above don't:
  # two concurrent `action-gh-release` calls racing to create-or-update the
  # SAME brand-new tag is a real TOCTOU hazard, so this job only runs once
  # the mac job has already created the Release, then just attaches assets
  # to it. Still tolerant of a partial `build-windows` matrix (see the `if:`
  # below): if only one arch's leg succeeded, whichever .zip/.sha256 exist
  # get uploaded — matches the "ship x86_64 for sure" fallback.
  release-windows:
    runs-on: ubuntu-latest
    needs: [build, build-windows, release-meta]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.release-meta.result == 'success' }}
    steps:
      - name: Download Windows build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: windows-*
          merge-multiple: true
          path: dist

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release-meta.outputs.tag }}
          # Fail loudly if BOTH build-windows legs failed (this job isn't gated on
          # build-windows so a total-failure would otherwise attach nothing and
          # still go green). A partial matrix success still ships the arch that built.
          fail_on_unmatched_files: true
          files: |
            dist/nova-v${{ needs.release-meta.outputs.version }}-*.zip
            dist/nova-v${{ needs.release-meta.outputs.version }}-*.zip.sha256

  # ── Generate + publish the nova bamboo-plugin bundle ──────────────────
  # `packaging/plugin/plugin.json` is committed as a TEMPLATE (a valid-shaped
  # placeholder version + sha256, so it validates on its own, but not the
  # real release values). This job fills it in for real: the tag's version,
  # and the real sha256 of the mac + Windows archives the jobs above already
  # built — reusing the `.sha256` sidecars they compute (never re-hashing).
  # It then packages `plugin.json` + `skills/` + `README.md` (content only —
  # no binary; `plugin.json`'s `artifacts` point at the platform archives
  # published above) into `nova-plugin-v<ver>.tar.gz`, the bundle a user
  # points `bamboo plugin install <url>` at, and also publishes the bare
  # `nova-plugin-v<ver>.json` for quick inspection.
  #
  # Windows-arch decision: bamboo's plugin schema gates `artifacts` by OS
  # only (macos/windows/linux, no per-arch key), so exactly one Windows
  # build must be chosen. `generate-manifest.sh` picks x86_64-pc-windows-msvc
  # for broad compatibility (runs natively on x64 and, via Windows' built-in
  # emulation, on ARM64 too) — same "ship x86_64 for sure" precedent as
  # `release-windows` above. See `packaging/plugin/README.md` for the
  # follow-up (a per-arch platform key) this punts on.
  #
  # Runs after `release-windows` (not just alongside it) purely to avoid two
  # concurrent `action-gh-release` calls touching the same just-created
  # release at once — same TOCTOU concern `release-windows`'s own comment
  # documents for its ordering after `build`.
  plugin-manifest:
    runs-on: ubuntu-latest
    needs: [build, build-windows, release-meta, release-windows]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.release-meta.result == 'success' && needs.release-windows.result == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-meta.outputs.commit }}

      - name: Download Windows build artifacts (for the .sha256 sidecar)
        uses: actions/download-artifact@v4
        with:
          pattern: windows-*
          merge-multiple: true
          path: dist

      - name: Resolve checksums + generate plugin.json
        id: manifest
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          MACOS_SHA="${{ needs.build.outputs.sha256 }}"
          WIN_ASSET="nova-v${VERSION}-x86_64-pc-windows-msvc.zip"
          WIN_SHA_FILE="dist/${WIN_ASSET}.sha256"
          if [ ! -f "$WIN_SHA_FILE" ]; then
            echo "::error::missing $WIN_SHA_FILE — the x86_64-pc-windows-msvc leg did not produce a checksum, cannot publish the plugin manifest"
            exit 1
          fi
          WIN_SHA="$(awk '{print $1}' "$WIN_SHA_FILE")"

          mkdir -p "dist/nova-plugin/skills"
          cp -R packaging/plugin/skills/. dist/nova-plugin/skills/
          cp packaging/plugin/README.md dist/nova-plugin/README.md
          bash packaging/plugin/generate-manifest.sh "$VERSION" "$MACOS_SHA" "$WIN_SHA" dist/nova-plugin/plugin.json

          # Structural sanity check before publishing (belt-and-suspenders;
          # generate-manifest.sh already shape-checks its own inputs).
          jq -e --arg v "$VERSION" \
            '.version == $v
             and (.artifacts.macos.sha256 | test("^[0-9a-f]{64}$"))
             and (.artifacts.windows.sha256 | test("^[0-9a-f]{64}$"))' \
            dist/nova-plugin/plugin.json > /dev/null

          cp dist/nova-plugin/plugin.json "dist/nova-plugin-v${VERSION}.json"
          tar -czf "dist/nova-plugin-v${VERSION}.tar.gz" -C dist/nova-plugin plugin.json skills README.md
          # Bundle checksum sidecar: `bamboo plugin install <url> --sha256 <hex>`
          # verifies the downloaded bundle against this (secure-by-default —
          # a URL install without a checksum is refused). Same `<hex>  <file>`
          # format as the binary-artifact sidecars.
          ( cd dist && shasum -a 256 "nova-plugin-v${VERSION}.tar.gz" > "nova-plugin-v${VERSION}.tar.gz.sha256" )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # ── Sign the bundle so bamboo's plugin-trust layer can verify Nova is
      # an authentic publisher ───────────────────────────────────────────
      # PINNED scheme — bamboo's verifier expects EXACTLY this, do not change
      # without updating bamboo too:
      #   - ed25519, raw 64-byte signature (no ASN.1/DER wrapping).
      #   - signed message = the exact bytes of the .tar.gz bundle itself
      #     (NOT its sha256).
      #   - sidecar `nova-plugin-v<ver>.tar.gz.sig` = the signature as
      #     lowercase hex (128 chars).
      # The private key lives only as the `NOVA_PLUGIN_SIGNING_KEY` repo
      # secret (an openssl ed25519 PEM); its public half is committed at
      # packaging/plugin/signing-key.pub for reference (bamboo's actual
      # trust root is its own baked-in default, not this file).
      #
      # Decision — skip-with-warning, not fail, when the secret is unset:
      # this lets the pipeline keep publishing (an UNSIGNED bundle, which
      # bamboo will refuse without `--allow-unsigned`) instead of hard-
      # breaking every release before the secret is provisioned. Once
      # `NOVA_PLUGIN_SIGNING_KEY` is set and signing should be mandatory,
      # flip the empty-key branch below from `exit 0` to `exit 1`.
      - name: Sign plugin bundle (ed25519)
        id: sign
        env:
          NOVA_PLUGIN_SIGNING_KEY: ${{ secrets.NOVA_PLUGIN_SIGNING_KEY }}
        run: |
          VERSION="${{ steps.manifest.outputs.version }}"
          BUNDLE="dist/nova-plugin-v${VERSION}.tar.gz"

          if [ -z "$NOVA_PLUGIN_SIGNING_KEY" ]; then
            echo "::warning::NOVA_PLUGIN_SIGNING_KEY secret is not set — publishing an UNSIGNED plugin bundle ($BUNDLE has no .sig). Installing it will require bamboo's --allow-unsigned flag until the secret is provisioned. See packaging/plugin/signing-key.pub."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "$NOVA_PLUGIN_SIGNING_KEY" > signing_key.pem
          chmod 600 signing_key.pem
          trap 'rm -f signing_key.pem' EXIT

          openssl pkeyutl -sign -inkey signing_key.pem -rawin -in "$BUNDLE" -out sig.bin
          xxd -p -c 256 sig.bin | tr -d '\n' > "${BUNDLE}.sig"
          rm -f sig.bin

          if ! grep -Eq '^[0-9a-f]{128}$' "${BUNDLE}.sig"; then
            echo "::error::signature is not 128 lowercase hex chars ($(wc -c < "${BUNDLE}.sig") chars produced) — aborting release rather than publishing a malformed .sig"
            exit 1
          fi

          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "Signed $BUNDLE -> ${BUNDLE}.sig (128 hex chars)"

      # Self-verify before publishing: reconstruct the pinned public key's
      # PEM from the hex committed at packaging/plugin/signing-key.pub and
      # confirm the signature just produced actually verifies against it.
      # Catches a wrong/corrupt NOVA_PLUGIN_SIGNING_KEY (e.g. mismatched
      # keypair) before it ships an unverifiable .sig to users.
      - name: Self-verify plugin bundle signature
        if: steps.sign.outputs.signed == 'true'
        run: |
          VERSION="${{ steps.manifest.outputs.version }}"
          BUNDLE="dist/nova-plugin-v${VERSION}.tar.gz"
          PUBHEX="$(grep -Eo '[0-9a-f]{64}' packaging/plugin/signing-key.pub | head -1)"

          # ed25519 SubjectPublicKeyInfo DER = fixed 12-byte ASN.1 prefix +
          # the raw 32-byte public key — lets openssl load a bare hex pubkey.
          printf '302a300506032b6570032100%s' "$PUBHEX" | xxd -r -p > pub.der
          openssl pkey -pubin -inform DER -in pub.der -pubout -out pub.pem
          xxd -r -p "${BUNDLE}.sig" > sig.bin

          if ! openssl pkeyutl -verify -pubin -inkey pub.pem -rawin -in "$BUNDLE" -sigfile sig.bin; then
            echo "::error::self-verify FAILED — the signature just produced does not verify against packaging/plugin/signing-key.pub. NOVA_PLUGIN_SIGNING_KEY may not match the pinned public key. Aborting before publishing a broken signature."
            rm -f pub.der pub.pem sig.bin
            exit 1
          fi
          rm -f pub.der pub.pem sig.bin
          echo "Self-verify OK: bundle signature matches packaging/plugin/signing-key.pub"

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release-meta.outputs.tag }}
          fail_on_unmatched_files: true
          files: |
            dist/nova-plugin-v${{ steps.manifest.outputs.version }}.tar.gz
            dist/nova-plugin-v${{ steps.manifest.outputs.version }}.tar.gz.sha256
            dist/nova-plugin-v${{ steps.manifest.outputs.version }}.json

      # Attached in its own step (rather than folded into the files list
      # above) because the .sig only exists when signing actually ran — see
      # the skip-if-unset decision on "Sign plugin bundle" above. A second
      # action-gh-release call updating the same just-created release
      # matches this workflow's existing pattern (release-windows, and the
      # step right above, both do this already).
      - name: Attach plugin signature to GitHub Release
        if: steps.sign.outputs.signed == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release-meta.outputs.tag }}
          fail_on_unmatched_files: true
          files: |
            dist/nova-plugin-v${{ steps.manifest.outputs.version }}.tar.gz.sig

  # ── Which optional publish steps can run (presence of their secrets) ──
  gate:
    runs-on: ubuntu-latest
    needs: build
    outputs:
      homebrew: ${{ steps.s.outputs.homebrew }}
      npm: ${{ steps.s.outputs.npm }}
    steps:
      - id: s
        run: |
          echo "homebrew=${{ secrets.HOMEBREW_TAP_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
          echo "npm=${{ secrets.NPM_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

  # ── Update the Homebrew tap formula ──────────────────────────────────
  homebrew:
    runs-on: ubuntu-latest
    needs: [build, gate]
    if: needs.gate.outputs.homebrew == 'true'
    steps:
      - name: Check out the tap repo
        uses: actions/checkout@v4
        with:
          repository: bigduu/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Write Formula/nova.rb
        env:
          VERSION: ${{ needs.build.outputs.version }}
          SHA256: ${{ needs.build.outputs.sha256 }}
          ASSET: ${{ needs.build.outputs.asset }}
        run: |
          mkdir -p tap/Formula
          cat > tap/Formula/nova.rb <<RUBY
          class Nova < Formula
            desc "Computer Use MCP server — macOS desktop control for LLM agents"
            homepage "https://github.com/bigduu/Nova"
            version "${VERSION}"
            url "https://github.com/bigduu/Nova/releases/download/v${VERSION}/${ASSET}"
            sha256 "${SHA256}"
            license "MIT"
            depends_on :macos

            def install
              bin.install "nova"
            end

            test do
              system "#{bin}/nova", "--version"
            end
          end
          RUBY

      - name: Commit + push
        working-directory: tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "formula already up to date"
          else
            git add Formula/nova.rb
            git commit -m "nova ${{ needs.build.outputs.version }}"
            git push
          fi

  # ── Publish the npm wrapper (downloads the release binary on install) ─
  npm:
    runs-on: ubuntu-latest
    needs: [build, gate, release-meta]
    if: needs.gate.outputs.npm == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-meta.outputs.commit }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: Set package version to the tag
        working-directory: npm
        run: npm version "${{ needs.build.outputs.version }}" --no-git-tag-version --allow-same-version
      - name: Publish
        working-directory: npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
