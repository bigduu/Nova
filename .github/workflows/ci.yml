name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  release-workflow-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned workflow parser
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3

      - name: Validate release workflow and app packaging
        run: scripts/test-release-workflow.sh

  chrome-extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chrome/extension
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Syntax check
        run: npm run check

      - name: Test
        run: npm test

  chrome-native-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache native-host cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            chrome/native-host/target
          key: ${{ runner.os }}-cargo-chrome-host-${{ hashFiles('chrome/native-host/Cargo.lock') }}

      - name: Format check
        run: cargo fmt --manifest-path chrome/native-host/Cargo.toml --all -- --check

      - name: Clippy
        run: cargo clippy --manifest-path chrome/native-host/Cargo.toml --all-targets -- -D warnings

      - name: Test
        run: cargo test --manifest-path chrome/native-host/Cargo.toml --verbose

  test:
    # Nova is macOS-only (ScreenCaptureKit / CoreGraphics), so CI must run on
    # macOS. macos-15+ is required: a transitive dep (apple-metal) compiles a
    # Swift bridge against macOS 15 Metal symbols (MTLLogState, MTLResidencySet,
    # …) that the macos-14 SDK lacks.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # apple-metal's Swift bridge needs the macOS 15 SDK (Xcode 16+); the
      # runner's default Xcode is older, so select the newest available.
      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets

      - name: Build
        run: cargo build --verbose

      # Runs unit + hermetic integration tests. The Screen-Recording e2e tests
      # are #[ignore]d because GitHub runners have no granted capture permission;
      # run them locally with `cargo test -- --include-ignored`.
      - name: Test
        run: cargo test --verbose

  # Windows port (src/platform/windows) gate. CROSS-COMPILES to
  # aarch64-pc-windows-msvc from an ubuntu runner — `cargo check`/`clippy` never
  # link, so no MSVC/Windows runner is needed (rustup ships the target's
  # precompiled std). ~15s once cached. This catches Windows-only breakage the
  # macOS `test` job above cannot see (the windows-crate FFI is entirely behind
  # `[target.'cfg(target_os = "windows")']` gating), on every push/PR. Full
  # native link (and now packaging) happens on every version tag in
  # release.yml's `build-windows` job (real windows-latest/windows-11-arm
  # runners); ad-hoc runtime/behavior verification beyond that (actually
  # exercising screenshot/UIA/OCR against a live desktop) is still done
  # out-of-band on a real ARM64 Windows 11 VM.
  windows-cross-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (+ Windows target)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: aarch64-pc-windows-msvc

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-winxcheck-${{ hashFiles('**/Cargo.lock') }}

      - name: Check (Windows target)
        run: cargo check --target aarch64-pc-windows-msvc --all-targets

      - name: Clippy (Windows target)
        run: cargo clippy --target aarch64-pc-windows-msvc --all-targets -- -D warnings

  # Headless-build gate (src/platform/headless): NATIVE ubuntu, so beyond
  # check/clippy it actually RUNS the server and proves the MCP handshake +
  # tools/list works with no desktop backend — the exact probe MCP registries
  # (e.g. Glama's Docker health check, see ./Dockerfile) run against us. The
  # desktop e2e tests are all `#![cfg]`-gated to macOS, so `--test e2e_stdio`
  # is the one that exists here.
  linux-headless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-headless-${{ hashFiles('**/Cargo.lock') }}

      - name: Clippy (headless build)
        run: cargo clippy --all-targets -- -D warnings

      - name: Stdio handshake smoke test (headless build)
        run: cargo test --test e2e_stdio --test e2e_managed_mcp --verbose

      - name: Application discovery fixture contracts (headless build)
        run: cargo test --lib app_inspection --verbose
