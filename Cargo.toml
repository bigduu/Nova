[package]
name = "nova"
version = "0.1.0"
edition = "2021"
description = "Computer Use MCP server — macOS desktop control for LLM agents. Screenshots, mouse, keyboard, window management, and app introspection."
license = "MIT"
repository = "https://github.com/bigduu/Nova"
keywords = ["mcp", "macos", "computer-use", "automation", "screenshot"]
categories = ["command-line-utilities", "os::macos-apis"]

[[bin]]
name = "nova"
path = "src/main.rs"

[dependencies]
# MCP protocol
rmcp = { version = "1.7", features = ["server", "transport-io", "transport-streamable-http-server", "macros"] }

# HTTP server (for Streamable HTTP transport)
axum = "0.8"
tokio-util = { version = "0.7", features = ["rt"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Image processing
image = "0.25"

# Encoding
base64 = "0.22"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"

# Raw syscalls for the capture-daemon plumbing (flock election, setsid, SIGKILL)
libc = "0.2"

# Error handling
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Error helpers
anyhow = "1"

# ── Platform-specific (macOS) ────────────────────────────────────────
# Everything below is Apple-framework-only and belongs exclusively to
# `src/platform/mac/*` (see src/platform/mod.rs for the cross-platform
# capability traits these implement). Gated so `cargo check`/`cargo build` on a
# non-macOS host never even attempts to compile Apple-only FFI bindings — the
# crate itself still refuses to build off macOS (see the `compile_error!` in
# `src/platform/mod.rs`), but that should be a fast, clean failure, not a
# dependency-compile failure.
[target.'cfg(target_os = "macos")'.dependencies]
# Screenshot capture (Apple ScreenCaptureKit)
screencapturekit = { version = "7.0", features = ["macos_14_0"] }

# Mouse/keyboard events (CoreGraphics CGEvent)
core-graphics = { version = "0.25", features = ["highsierra", "elcapitan"] }

# macOS Accessibility API (window/app introspection)
accessibility = "0.2"
accessibility-sys = "0.2"            # raw AXValueGetValue for AXPosition/AXSize
core-foundation = "0.10"            # CFString/CFType — must match accessibility's

# Apple Vision OCR (VNRecognizeTextRequest) — native, on-device, no model files.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["NSString", "NSArray", "NSData", "NSDictionary", "NSError"] }
objc2-vision = { version = "0.3", default-features = false, features = ["VNRequest", "VNRequestHandler", "VNRecognizeTextRequest", "VNObservation", "VNTypes", "VNError", "objc2-core-foundation"] }

# ── Platform-specific (Windows) ───────────────────────────────────────
# The Windows P1 sibling of `platform::mac` — `src/platform/windows/*` — built
# entirely on the official `windows` crate (Win32 metadata bindings), gated the
# same way as the macOS deps above so a macOS/Linux `cargo build` never fetches
# them. Only the feature modules the Windows capability impls actually use are
# enabled (see each `src/platform/windows/*.rs` module doc for which trait it
# backs):
#   - Foundation                    — HWND/POINT/RECT/BOOL and friends
#   - Graphics_Gdi                  — BitBlt/PrintWindow-adjacent GDI capture
#   - UI_WindowsAndMessaging        — EnumWindows/PrintWindow/SendInput consts,
#                                      GetSystemMetrics (incl. virtual-desktop),
#                                      SetForegroundWindow, ShowWindow
#   - UI_Input_KeyboardAndMouse     — SendInput/INPUT/MOUSEINPUT/KEYBDINPUT
#   - UI_HiDpi                      — SetProcessDpiAwarenessContext (Per-Monitor-v2)
#   - UI_Shell                      — ShellExecuteW (open_application)
#   - System_DataExchange           — OpenClipboard/GetClipboardData/SetClipboardData
#   - System_Memory                 — GlobalAlloc/GlobalLock (clipboard buffer)
#   - System_Threading               — OpenProcess/QueryFullProcessImageNameW (app name)
#   - System_ProcessStatus           — GetModuleBaseNameW fallback for app name
#   - System_Ole                     — CF_UNICODETEXT (clipboard format id)
#   - Storage_Xps                    — PrintWindow (window capture)
#   - Graphics_Dwm                   — DwmGetWindowAttribute DWMWA_CLOAKED (hide
#                                      DWM-cloaked windows, e.g. background UWP)
#   - UI_Accessibility (P2)          — IUIAutomation/IUIAutomationElement &c.
#                                      (`platform::windows::elements`'s real
#                                      `UiTree` impl — Set-of-Mark discovery +
#                                      `click_mark` via UI Automation)
#   - System_Com (P2)                — CoCreateInstance/CoInitializeEx/CLSCTX
#                                      (activating `CUIAutomation` + joining
#                                      the process's Multi-Threaded Apartment;
#                                      also a transitive requirement of
#                                      UI_Accessibility's SAFEARRAY-bearing
#                                      methods)
#   - Media_Ocr (P3)                 — `Windows::Media::Ocr::OcrEngine` &c.,
#                                      the WinRT analog of macOS's Apple
#                                      Vision OCR (`platform::windows::ocr`)
#   - Graphics_Imaging (P3)          — `SoftwareBitmap`/`BitmapDecoder` (decode
#                                      the same JPEG/PNG bytes a `screenshot`
#                                      produces into the pixel buffer OCR
#                                      needs)
#   - Storage_Streams (P3)           — `InMemoryRandomAccessStream`/`DataWriter`
#                                      (wrap the encoded image bytes in a WinRT
#                                      stream `BitmapDecoder` can read)
#   - Globalization (P3)             — `Language`/`OcrEngine::TryCreateFromLanguage`
#                                      (BCP-47 -> WinRT `Language`, and the
#                                      per-language OCR-pack lookup)
#   - Foundation / Foundation_Collections (P3) — `IAsyncOperation<T>::get()`
#                                      (blocking wait -- no async executor
#                                      needed, see `platform::windows::ocr`'s
#                                      module doc) and `IVectorView<T>`
#                                      iteration (`OcrResult::Lines()`/
#                                      `OcrLine::Words()`, both gated on this
#                                      feature in the `windows` crate's own
#                                      generated bindings)
#   - Graphics_Capture (P4)          — GraphicsCaptureItem/Session/
#                                      Direct3D11CaptureFramePool (WGC window
#                                      capture — fixes the GPU-composited
#                                      black-bitmap bug PrintWindow has on
#                                      hardware-accelerated browsers/Electron)
#   - Graphics_DirectX_Direct3D11 (P4) — the WinRT IDirect3DDevice/pixel-format
#                                      types the frame pool is parameterized on
#   - Win32_Graphics_Direct3D11 (P4) — D3D11CreateDevice + ID3D11Texture2D
#                                      staging-texture readback
#   - Win32_Graphics_Direct3D (P4)   — D3D_DRIVER_TYPE_HARDWARE
#   - Win32_Graphics_Dxgi (P4)       — IDXGIDevice (D3D11 device -> WinRT device)
#   - Win32_Graphics_Dxgi_Common (P4) — DXGI_FORMAT/DXGI_SAMPLE_DESC; a
#                                      transitive requirement `windows` doesn't
#                                      auto-enable from Win32_Graphics_Direct3D11
#                                      alone — without it, D3D11_TEXTURE2D_DESC
#                                      and ID3D11Texture2D::GetDesc/
#                                      ID3D11Device::CreateTexture2D are
#                                      `cfg`'d out of existence entirely
#   - Win32_System_WinRT_Direct3D11 (P4) — CreateDirect3D11DeviceFromDXGIDevice/
#                                      IDirect3DDxgiInterfaceAccess (WinRT <->
#                                      Win32 D3D11 interop, both directions)
#   - Win32_System_WinRT_Graphics_Capture (P4) — IGraphicsCaptureItemInterop
#                                      (HWND -> GraphicsCaptureItem — the
#                                      interop factory that gets us a capture
#                                      item without WinAppSDK/consent prompts)
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_Ole",
    "Win32_Storage_Xps",
    "Win32_UI_Accessibility",
    "Win32_System_Com",
    "Media_Ocr",
    "Graphics_Imaging",
    "Storage_Streams",
    "Globalization",
    "Foundation",
    "Foundation_Collections",
    "Graphics_Capture",
    "Graphics_DirectX_Direct3D11",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
] }
