[package]
name = "nova"
version = "0.1.0"
edition = "2021"
description = "Computer Use MCP server — macOS desktop control for LLM agents. Screenshots, mouse, keyboard, window management, and app introspection."
license = "MIT"
repository = "https://github.com/bigduu/Nova"
keywords = ["mcp", "macos", "computer-use", "automation", "screenshot"]
categories = ["command-line-utilities", "os::macos-apis"]

[[bin]]
name = "nova"
path = "src/main.rs"

[dependencies]
# MCP protocol
rmcp = { version = "1.7", features = ["server", "transport-io", "transport-streamable-http-server", "macros"] }

# HTTP server (for Streamable HTTP transport)
axum = "0.8"
tokio-util = { version = "0.7", features = ["rt"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Image processing
image = "0.25"

# Encoding
base64 = "0.22"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"

# Raw syscalls for the capture-daemon plumbing (flock election, setsid, SIGKILL)
libc = "0.2"

# Error handling
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Error helpers
anyhow = "1"

# ── Platform-specific (macOS) ────────────────────────────────────────
# Everything below is Apple-framework-only and belongs exclusively to
# `src/platform/mac/*` (see src/platform/mod.rs for the cross-platform
# capability traits these implement). Gated so `cargo check`/`cargo build` on a
# non-macOS host never even attempts to compile Apple-only FFI bindings — the
# crate itself still refuses to build off macOS (see the `compile_error!` in
# `src/platform/mod.rs`), but that should be a fast, clean failure, not a
# dependency-compile failure.
[target.'cfg(target_os = "macos")'.dependencies]
# Screenshot capture (Apple ScreenCaptureKit)
screencapturekit = { version = "7.0", features = ["macos_14_0"] }

# Mouse/keyboard events (CoreGraphics CGEvent)
core-graphics = { version = "0.25", features = ["highsierra", "elcapitan"] }

# macOS Accessibility API (window/app introspection)
accessibility = "0.2"
accessibility-sys = "0.2"            # raw AXValueGetValue for AXPosition/AXSize
core-foundation = "0.10"            # CFString/CFType — must match accessibility's

# Apple Vision OCR (VNRecognizeTextRequest) — native, on-device, no model files.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["NSString", "NSArray", "NSData", "NSDictionary", "NSError"] }
objc2-vision = { version = "0.3", default-features = false, features = ["VNRequest", "VNRequestHandler", "VNRecognizeTextRequest", "VNObservation", "VNTypes", "VNError", "objc2-core-foundation"] }

# ── Platform-specific (Windows) ───────────────────────────────────────
# The Windows P1 sibling of `platform::mac` — `src/platform/windows/*` — built
# entirely on the official `windows` crate (Win32 metadata bindings), gated the
# same way as the macOS deps above so a macOS/Linux `cargo build` never fetches
# them. Only the feature modules the Windows capability impls actually use are
# enabled (see each `src/platform/windows/*.rs` module doc for which trait it
# backs):
#   - Foundation                    — HWND/POINT/RECT/BOOL and friends
#   - Graphics_Gdi                  — BitBlt/PrintWindow-adjacent GDI capture
#   - UI_WindowsAndMessaging        — EnumWindows/PrintWindow/SendInput consts,
#                                      GetSystemMetrics (incl. virtual-desktop),
#                                      SetForegroundWindow, ShowWindow
#   - UI_Input_KeyboardAndMouse     — SendInput/INPUT/MOUSEINPUT/KEYBDINPUT
#   - UI_HiDpi                      — SetProcessDpiAwarenessContext (Per-Monitor-v2)
#   - UI_Shell                      — ShellExecuteW (open_application)
#   - System_DataExchange           — OpenClipboard/GetClipboardData/SetClipboardData
#   - System_Memory                 — GlobalAlloc/GlobalLock (clipboard buffer)
#   - System_Threading               — OpenProcess/QueryFullProcessImageNameW (app name)
#   - System_ProcessStatus           — GetModuleBaseNameW fallback for app name
#   - System_Ole                     — CF_UNICODETEXT (clipboard format id)
#   - Storage_Xps                    — PrintWindow (window capture)
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_Ole",
    "Win32_Storage_Xps",
] }
