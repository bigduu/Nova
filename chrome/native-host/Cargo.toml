[package]
name = "nova-chrome-bridge"
version = "0.1.0"
edition = "2021"
description = "Private Chrome Native Messaging bridge for Nova.app"
license = "MIT"
license-file = "../../LICENSE"
publish = false

[lib]
name = "nova_chrome_bridge"
path = "src/lib.rs"

[[bin]]
name = "nova-chrome-host"
path = "src/main.rs"

[dependencies]
anyhow = "1"
libc = "0.2"
serde_json = "1"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization",
    "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_IO",
    "Win32_System_Pipes", "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp", "Win32_System_SystemInformation",
    "Win32_System_Registry", "Win32_System_Com", "Win32_UI_Shell",
] }
